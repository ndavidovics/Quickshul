<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Navy rounded-square background -->
  <rect width="512" height="512" rx="88" fill="#1a2d5a"/>

  <!-- ══ LEFT POLE ══ -->
  <rect x="102" y="136" width="28" height="240" rx="14" fill="#c9a84c"/>

  <!-- ══ RIGHT POLE ══ -->
  <rect x="382" y="136" width="28" height="240" rx="14" fill="#c9a84c"/>

  <!-- ══ TOP-LEFT FINIAL ══ -->
  <rect x="109" y="108" width="14" height="32" rx="5" fill="#c9a84c"/>
  <ellipse cx="116" cy="100" rx="15" ry="12" fill="#c9a84c"/>
  <path d="M108 88 Q116 66 124 88 L120 82 Q116 79 112 82 Z" fill="#c9a84c"/>
  <circle cx="116" cy="63" r="9" fill="#c9a84c"/>

  <!-- ══ TOP-RIGHT FINIAL ══ -->
  <rect x="389" y="108" width="14" height="32" rx="5" fill="#c9a84c"/>
  <ellipse cx="396" cy="100" rx="15" ry="12" fill="#c9a84c"/>
  <path d="M388 88 Q396 66 404 88 L400 82 Q396 79 392 82 Z" fill="#c9a84c"/>
  <circle cx="396" cy="63" r="9" fill="#c9a84c"/>

  <!-- ══ BOTTOM-LEFT FINIAL ══ -->
  <rect x="109" y="372" width="14" height="32" rx="5" fill="#c9a84c"/>
  <ellipse cx="116" cy="412" rx="15" ry="12" fill="#c9a84c"/>
  <path d="M108 424 Q116 446 124 424 L120 430 Q116 433 112 430 Z" fill="#c9a84c"/>
  <circle cx="116" cy="449" r="9" fill="#c9a84c"/>

  <!-- ══ BOTTOM-RIGHT FINIAL ══ -->
  <rect x="389" y="372" width="14" height="32" rx="5" fill="#c9a84c"/>
  <ellipse cx="396" cy="412" rx="15" ry="12" fill="#c9a84c"/>
  <path d="M388 424 Q396 446 404 424 L400 430 Q396 433 392 430 Z" fill="#c9a84c"/>
  <circle cx="396" cy="449" r="9" fill="#c9a84c"/>

  <!-- ══ PARCHMENT BODY — concave top & bottom ══ -->
  <path d="M 130 170 Q 256 146 382 170 L 382 342 Q 256 366 130 342 Z"
        fill="#f5e8c8"/>

  <!-- Parchment top rolled-edge shadow -->
  <path d="M 130 170 Q 256 158 382 170 Q 256 182 130 170 Z"
        fill="#c4a05a" opacity="0.35"/>

  <!-- Parchment bottom rolled-edge shadow -->
  <path d="M 130 342 Q 256 330 382 342 Q 256 354 130 342 Z"
        fill="#c4a05a" opacity="0.35"/>

  <!-- Parchment border -->
  <path d="M 130 170 Q 256 146 382 170 L 382 342 Q 256 366 130 342 Z"
        fill="none" stroke="#c9a84c" stroke-width="2.5"/>

  <!-- ══ Qs MONOGRAM ══ -->
  <!-- Large Q in navy -->
  <text x="238" y="262"
        font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif"
        font-weight="bold"
        font-size="148"
        fill="#1a2d5a"
        text-anchor="middle"
        dominant-baseline="middle">Q</text>

  <!-- Small s in gold, nestled inside Q lower-right bowl -->
  <text x="282" y="290"
        font-family="'Nimbus Sans', 'DejaVu Sans', sans-serif"
        font-weight="bold"
        font-size="82"
        fill="#c9a84c"
        text-anchor="middle"
        dominant-baseline="middle">s</text>

</svg>
